[workspace]
members = ["crates/acp-tap", "crates/acp-supervisor", "acpd", "agents/claude", "agents/codex"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
missing_panics_doc = "allow"
struct_field_names = "allow"
