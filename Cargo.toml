[workspace]
members = ["crates/avirt", "crates/avirt-core", "crates/avirtacp", "crates/avirtadmin", "crates/avirtagent", "crates/avirtapid", "crates/avirtauditd", "crates/avirtbuilderd", "crates/avirtdnsd", "crates/avirtedgeproxyd", "crates/avirtenvoy", "crates/avirtexec", "crates/avirtguest", "crates/avirtguestd", "crates/avirthostd", "crates/avirtinitd", "crates/avirtlogd", "crates/avirtmcp", "crates/avirtmcpgwd", "crates/avirtmediatord", "crates/avirtmedproxyd", "crates/avirtmodelgwd", "crates/avirtnetd", "crates/avirtoteld", "crates/avirtpolicyd", "crates/avirtregistryd", "crates/avirtsecretsd", "crates/avirtwebd"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
missing_panics_doc = "allow"
struct_field_names = "allow"
