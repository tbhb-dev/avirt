---
# A term goes on this list only when the maintainer rejects it. Terms with a plain
# replacement live in RejectedTermsReplaced.yml, which names the replacement in its message.
extends: existence
message: "'%s' is a rejected term. Say what it names in plain words."
level: error
tokens:
  - (?i)peer card
  - (?i)link splice
  - (?i)uplink
  - (?i)mediator instance number
  - (?i)control routes
  - (?i)control process
  - (?i)data process
  - (?i)binding lease
  - (?i)native edge proxy
  - (?i)native peer listener
  - (?i)exact-ID verifier
  - (?i)control heartbeat
  - (?i)identity lifetime bound
  - (?i)the usual workload writers
  - (?i)avirtmediationd
  - (?i)avirt names?
  - (?i)helpers?
  - (?i)peered names?
  - (?i)local provenance
  - (?i)guest root
  - (?i)event provenance
  - (?i)provenance labels?
  - (?i)off-host rules?
  - (?i)off-host enforcement
  - (?i)policy invariants?
  - (?i)non-policy checks?
  - (?i)required-\w+ invariants?
  - (?i)guardrails?
  - (?i)permissions boundar(?:y|ies)
  - (?i)mediator-bound credentials?
  - (?i)SPIFFE bundles?
  - (?i)prebuild polic(?:y|ies)
