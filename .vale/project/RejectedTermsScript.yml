---
# A term goes on this list only when the maintainer rejects it. These terms hold a word that
# vocabularies/project/accept.txt accepts, and Vale drops any match containing an accepted
# word, so an existence or substitution rule never fires on them. A script rule matches raw text
# and is not filtered. Replacements: avirt name -> internal name; SPIFFE bundle -> trust bundle;
# control SVID -> say what it names in plain words.
extends: script
message: >-
  '%s' is a rejected term. Replacements: avirt name, internal name; SPIFFE bundle, trust bundle; control SVID,
  say what it names.
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  for m in text.re_find("(?i)\\b(?:avirt names?|SPIFFE bundles?|control SVIDs?)\\b", scope, -1) {
    matches = append(matches, {begin: m[0].begin, end: m[0].end})
  }
