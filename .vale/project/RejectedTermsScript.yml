---
# A term goes on this list only when the maintainer rejects it. These terms hold a word that
# vocabularies/project/accept.txt accepts, and Vale drops any match containing an accepted
# word, so an existence or substitution rule never fires on them. A script rule matches raw text
# and is not filtered, so it leaves inline code and fenced blocks
# out itself. Replacements:
# avirt name -> avirt hostname; SPIFFE bundle -> trust bundle; control SVID -> say what it
# names in plain words. A SPIFFE bundle followed by format or endpoint passes, because those are
# the SPIFFE specification's own terms.
extends: script
message: >-
  '%s' is a rejected term. Replacements: avirt name, avirt hostname; SPIFFE bundle, trust bundle; control SVID,
  say what it names.
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  code := text.re_find("(?s)```.*?```|~~~.*?~~~|`[^`\\n]*`", scope, -1)
  for m in text.re_find("(?i)\\b(?:avirt names?|SPIFFE bundles?|control SVIDs?)\\b", scope, -1) {
    quoted := false
    if is_array(code) {
      for c in code {
        if m[0].begin >= c[0].begin && m[0].begin < c[0].end {
          quoted = true
        }
      }
    }
    spec := text.has_prefix(text.to_lower(m[0].text), "spiffe bundle") &&
      text.re_match("(?i)^ (?:format|endpoint)\\b", scope[m[0].end:])
    if !quoted && !spec {
      matches = append(matches, {begin: m[0].begin, end: m[0].end})
    }
  }
