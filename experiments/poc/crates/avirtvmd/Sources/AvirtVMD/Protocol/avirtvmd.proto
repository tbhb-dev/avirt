syntax = "proto3";
package avirt.vmd.v1;

// avirthostd sends HostMessage frames; avirtvmd sends HelperMessage frames.
message HostMessage {
  oneof body {
    HostHello hello = 1;
    Refusal refusal = 2;
    Request request = 3;
  }
}

message HelperMessage {
  oneof body {
    HelperHello hello = 1;
    Refusal refusal = 2;
    Response response = 3;
    Event event = 4;
  }
}

// The helper's first frame on every connection.
message HelperHello {
  uint32 min_version = 1;
  uint32 max_version = 2;
  string workload_id = 3;
  bytes incarnation = 4;  // 16 bytes
}

// avirthostd's answer: the version it chose, or a Refusal.
message HostHello {
  uint32 version = 1;
}

enum RefusalCode {
  REFUSAL_CODE_UNSPECIFIED = 0;
  REFUSAL_CODE_UNSUPPORTED_VERSION = 1;
  REFUSAL_CODE_WRONG_WORKLOAD = 2;
  REFUSAL_CODE_STALE_INCARNATION = 3;
  REFUSAL_CODE_WRONG_PEER = 4;
}

message Refusal {
  RefusalCode code = 1;
  string message = 2;
}

message Request {
  uint64 id = 1;
  oneof op {
    StartWorkload start_workload = 2;
    Status status = 3;
    Stop stop = 4;
  }
}

message Response {
  uint64 id = 1;
  oneof result {
    Started started = 2;
    StatusReply status = 3;
    Stopped stopped = 4;
    Failure failure = 5;
  }
}

message Event {
  oneof kind {
    WorkloadExited workload_exited = 1;
  }
}

message StartWorkload {
  string spec_digest = 1;
  string kernel_path = 2;
  string initfs_path = 3;
  string rootfs_base_path = 4;   // read-only cache entry; avirtvmd clones it
  string container_dir = 5;      // containers/<id>/, created by avirtvmd with mode 0700
  string image_config_path = 6;  // the OCI image config blob in images/
  repeated string env = 7;       // KEY=VALUE, appended to the image's environment
  repeated Share shares = 8;
  repeated Socket sockets = 9;
  string stdio_log_path = 10;
}

message Share {
  string host_path = 1;
  string guest_path = 2;
}

message Socket {
  string host_path = 1;
  string guest_path = 2;
  uint32 mode = 3;
}

message Started {}
message Status {}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_IDLE = 1;
  STATE_STARTING = 2;
  STATE_RUNNING = 3;
  STATE_EXITED = 4;
  STATE_STOPPING = 5;
}

message StatusReply {
  State state = 1;
  ExitStatus exit = 2;  // set in STATE_EXITED
}

message Stop {
  uint32 grace_seconds = 1;
}

message Stopped {}

message Failure {
  string message = 1;
}

message WorkloadExited {
  ExitStatus exit = 1;
}

message ExitStatus {
  optional int32 code = 1;
  optional int32 signal = 2;
  string error = 3;
}
