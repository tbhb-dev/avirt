[package]
name = "agentvmm-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agentvmm-core = { path = "../agentvmm-core" }
agent-client-protocol = { version = "3.4.0", features = ["process", "unstable_protocol_v2"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
