[package]
name = "acp-tap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol = { version = "3.4.0", features = ["process"] }
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http2", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "http2", "client", "server"] }
rand = "0.10.3"
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
seccompiler = "0.5.0"
