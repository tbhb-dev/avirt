[package]
name = "avirtenvoy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "The Envoy dynamic module that checks CONNECT destinations and reports connection events to avirtmediatord."
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
avirt-connect = { path = "../avirt-connect" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", rev = "9e5580933739775e8bce696a57a2e1bc99368f23" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "time"] }

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
struct_field_names = "allow"

[lints.rust]
unsafe_code = "forbid"
