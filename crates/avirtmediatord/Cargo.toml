[package]
name = "avirtmediatord"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
avirt-connect = { path = "../avirt-connect" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
httparse = "1.10"
pingora-core = { version = "=0.9.0", default-features = false }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "io-std", "time", "sync", "macros"] }
