[package]
name = "avirt-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol = { version = "3.4.0", features = ["process"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "http2", "server", "tokio"] }
prost = "0.14.4"
rand = "0.10.3"
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
seccompiler = "0.5.0"

[features]
# Tests that start a real avirtvmd, found through AVIRT_VMD_BIN. They need macOS and the built helper.
avirtvmd-tests = []

[lints]
workspace = true
