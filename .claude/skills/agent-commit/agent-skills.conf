# Repository settings for the agent-commit, agent-pr, and agent-merge-pr
# skills. A copy of the skills in another repository edits this file and
# nothing else.
#
# Each line is `key = value`. The environment overrides a key as
# AGENT_SKILLS_<KEY>, and so does ~/.config/agent-skills/<repository>.conf.
# Paths that belong to one machine go in one of those two places, never
# here: `review_cmd`, `gh_login`, `owner_login` and `merge_ready_cmd` are
# four of them. `gh_login` defaults to tbhb-agent, `owner_login` to tbhb,
# and an empty `merge_ready_cmd` adds no readiness check to a merge. The
# owner's approval on a pull request's head clears a loosened gate. The
# machine's file is optional.

# The independent reviewer: a headless run on this model at this effort.
# Both are required. No harness default is ever used.
review_model = claude-sonnet-5-5
review_effort = medium

# How many times a review may return findings. Past this bound the review
# stops, stamps nothing, and mails the findings as a blocker.
review_max_rounds = 3

# The installed review skills hold the criteria each review applies.
review_commit_criteria = .claude/skills/review-commit-message/SKILL.md
review_pr_criteria = .claude/skills/review-pr-description/SKILL.md
review_squash_criteria = .claude/skills/review-squash-message/SKILL.md

# The commit-msg gates, as the repository runs them.
lint_commit_cmd = mise run lint-commit-msg

# The same gates for a squash message in SQUASH_AGENTMSG. An empty value
# refuses every review and merge.
lint_squash_cmd = mise run lint-squash-msg

# The label that sends a pull request to the owner.
# agent-merge-pr refuses a pull request that has it.
owner_review_label = owner-review

# The account whose approving review, on the pull request's current head,
# a merge needs. An empty value refuses every merge.
required_reviewer = tbhb-agent-reviewer

# The ignored paths that a merged branch's worktree may hold and still
# go: caches anything can regenerate, Vale's synced styles, and the
# agent drafts that a commit, a publish, or a merge consumed. Any other
# ignored path, such as .env or mise.local.toml, keeps the worktree.
disposable_ignored = ^(target|node_modules|apm_modules|\.rumdl_cache|\.fix-prose)/|^\.vale/|^\.cspell-cache$|(^|/)\.DS_Store$|^(COMMIT_AGENTMSG|PR_AGENTDESC\.md|SQUASH_AGENTMSG)$

# Where the repository keeps its ruleset files. agent-merge-pr reads the
# checks the base branch requires from those files as the base commit
# has them, beside the rulesets GitHub applies.
ruleset_dir = .github/rulesets

# Golden files and test baselines. They change only on the owner's review
# of the baseline diff, so agent-merge-pr refuses a pull request that
# changes one. The repository has none, and an empty value refuses every
# merge, so the pattern matches no path: a changed path is never empty.
golden_paths = ^$

# What agent-merge-pr reads as a loosened gate: suppression
# markers on any added line, lowercase, and the gate and lint
# configuration files where an added exclusion or a removed hook counts.
loosening_markers = noqa|cspell: *(ignore|disable|words)|vale +off|<!-- *vale [a-z0-9.]+ *= *no|shellcheck +disable|rumdl-disable|markdownlint-disable|nolint|#!?[[](allow|expect)[(]|[a-z0-9_]+ *= *"allow"|(-a|--allow)[ =]clippy::|^[[:space:]]*([{][[:space:]]*(id|crate)[[:space:]]*=|"rustsec-)
gate_config_paths = ^([.]pre-commit-config[.]yaml|[.]agents/skills/agent-commit/agent-skills[.]conf|apm[.]lock[.]yaml|[.]shellcheckrc|[.]agents/skills/[.]shellcheckrc|[.]cspell.*|[.]rumdl[.]toml|[.]vale[.]ini|[.]vale/.*|[.]yamllint.*|mise[.](toml|lock)|deny[.]toml|clippy[.]toml|[.]?rustfmt[.]toml|[.]config/nextest[.]toml|Cargo[.]toml|biome[.]jsonc?|tombi[.]toml|[.]github/workflows/.*|[.]github/rulesets/.*)$

# How many times merge.sh asks GitHub whether the pull request merged
# before it gives up. It waits two seconds between asks.
merge_verify_tries = 5

# The git hooks a commit needs, and the line that marks each one as the
# repository's own. Without the pre-commit hook, git commit skips every
# check on the staged content. prek writes this line into each hook it
# installs.
required_hooks = commit-msg pre-commit post-commit
hook_marker = File generated by prek

# The checks on a pull request description. The lint is the repository's
# own. A description ends with a `Log entry:` line when `pr_log_entry` is
# `required`, and any other value, such as `off`, drops that check. Each
# item under Related matches the pattern, and an empty pattern skips that
# check. The title check runs with AS_BASE, AS_HEAD, and AS_TITLE set, and
# an empty command skips it. The repository has no title check beyond the
# shape validate-description.sh already enforces, so the command is empty.
lint_pr_cmd = mise run lint-pr-description
pr_log_entry = off
pr_related_pattern = ^#[0-9]+$
pr_title_check_cmd =

# Where reports go. A repository without a mailbox leaves these empty,
# and the scripts print each report instead.
mail_cmd =
mail_to =

# Paths whose changes go to the owner: the gate and lint configuration,
# the toolchain pins and the vendored payload, the manifests that deploy
# the agent primitives, the rest of .github/, AGENTS.md, and the agent
# skills themselves, the agent-commit skill included. agent-merge-pr lists
# the ones a pull request changes in its report and doesn't refuse.
owner_paths = ^(AGENTS[.]md$|mise[.](toml|lock)$|apm|vendir|[.]shellcheckrc$|[.]pre-commit-config[.]yaml$|[.]github/|[.]config/mise/|[.]config/nextest[.]toml$|[.]devtools/|[.]cspell|[.]rumdl|[.]yamllint|[.]vale[.]ini$|[.]vale/|[.]claude/|[.]agents/|[.]codex/|deny[.]toml$|clippy[.]toml$|[.]?rustfmt[.]toml$|Cargo[.]toml$|Cargo[.]lock$|crates/[^/]+/Cargo[.]toml$|biome[.]jsonc?$|tombi[.]toml$)
