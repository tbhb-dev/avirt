# agentvmm-poc host toolchain and tasks. Apple `container` (1.5.0 or later) is a prerequisite that mise cannot install.
# Credentials live in the uncommitted mise.local.toml, which mise loads on top of this file.

[tools]
uv = "latest"
# The one source of truth for the Rust version: the crates' `rust-version` and the images'
# builder stage (`rust:1.97.1-bookworm`) follow it.
rust = { version = "1.97.1", profile = "minimal", components = "clippy,rustfmt" }

[tasks.build]
description = "Build every crate"
run = "cargo build --workspace"

[tasks.test]
description = "Run the unit tests"
run = "cargo test --workspace"

[tasks.lint]
description = "clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks.check-docs]
shell = "bash -c"
description = "guard-markdown on every tracked Markdown file, then the docs structure check"
run = """
command -v guard-markdown >/dev/null || { echo "guard-markdown not found; install it with: go install github.com/tbhb/repotools/cmd/guard-markdown@latest" >&2; exit 1; }
git ls-files -z '*.md' | while IFS= read -r -d '' f; do [ -e "$f" ] && printf '%s\\0' "$f"; done | xargs -0 guard-markdown
uv run --no-project --with pyyaml python scripts/okf-check.py docs
"""

[tasks.check]
description = "fmt --check, clippy -D warnings, the tests and check-docs"
depends = ["check-docs"]
run = [
  "cargo fmt --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks.build-image]
description = "Build one workload image (claude or codex); the repository root is the build context"
usage = 'arg "<agent>" help="claude or codex"'
run = "container build -f workloads/${usage_agent}/Containerfile -t agentvmm-workload-${usage_agent}:dev ."

[tasks.build-images]
description = "Build both workload images"
depends = ["build-image claude", "build-image codex"]

[tasks.serve]
description = "Run the controller (picks CLAUDE_CODE_OAUTH_TOKEN up from mise.local.toml)"
depends = ["build-controller"]
run = "./target/debug/agentvmm-controller"

[tasks.build-controller]
description = "Build the controller and the supervisor it starts for each actor"
hide = true
run = "cargo build --quiet -p agentvmm-controller -p agentvmm-supervisor"

[tasks.launch]
description = "Start an actor on a running controller: mise run launch claude \"prompt\" -- --follow"
usage = '''
arg "<agent>" help="claude or codex"
arg "<prompt>"
arg "[flags]" var=#true help="extra flags such as --cwd DIR --follow"
'''
run = 'cargo run --quiet -p agentvmm-cli -- launch --agent "${usage_agent}" "${usage_prompt}" ${usage_flags}'
