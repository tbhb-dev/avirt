# avirt host toolchain and tasks. Apple `container` (1.5.0 or later) is a prerequisite that mise cannot install.
# Credentials live in the uncommitted mise.local.toml, which mise loads on top of this file.

[settings]
lockfile = true
idiomatic_version_file_enable_tools = []

[tools]
vendir = "0.46.2"
apm = "0.33.0"
shfmt = "3.14.1"
jq = "1.8.2"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"github:Boshen/cargo-shear" = "1.14.0"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-fuzz" = "0.13.2"
"go:github.com/tbhb-dev/devtools/cmd/guard-markdown" = "v0.12.0"
# The one source of truth for the Rust version: the crates' `rust-version` and the images'
# builder stage (`rust:1.97.1-bookworm`) follow it.
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt,llvm-tools" }

[env]
DEVTOOLS_LOCK_PLATFORMS = "linux-x64,macos-arm64"
DEVTOOLS_GENERATED_PATHS = ".devtools/\n.config/mise/\ntarget/\ntmp/\nspikes/\nlogs/\n.vale/"
DEVTOOLS_PROSE_GLOB = "*.{md,rs}"
# Fuzzing needs a nightly compiler; this pin is used by the fuzz tasks only. Stable stays at the rust tool above.
AVIRT_FUZZ_TOOLCHAIN = "nightly-2026-08-01"

[task_config]
includes = [
  ".devtools/tasks/apm.toml",
  ".devtools/tasks/fix.toml",
  ".devtools/tasks/format.toml",
  ".devtools/tasks/git-hooks.toml",
  ".devtools/tasks/leaks.toml",
  ".devtools/tasks/lint.toml",
  ".devtools/tasks/pins.toml",
  ".devtools/tasks/preapproval.toml",
  ".devtools/tasks/security.toml",
  ".devtools/tasks/toolchain.toml",
  ".devtools/tasks/vendir.toml",
]

[tasks.bootstrap]
description = "Sync the vendored payload, install the toolchain, and install git hooks"
alias = "setup"
run = [
  "vendir sync",
  "mise run install-toolchain",
  "mise run install-tools",
  "mise run devtools:prek-install",
  "mise run devtools:install-leak-hook",
]

[tasks.install-toolchain]
description = "Install the pinned toolchain from mise.toml and the vendored conf.d"
run = "mise install"

[tasks.install-tools]
description = "Download the Vale style packages .vale.ini names"
run = "vale sync"

[tasks.build]
description = "Build every crate"
run = "cargo build --workspace"

[tasks.test]
description = "Run every test under nextest (NEXTEST_PROFILE=ci selects the CI profile), then the doc tests"
run = [
  "cargo nextest run --workspace --locked",
  "cargo test --workspace --doc --locked",
]

[tasks.lint-rust]
description = "clippy with every group at deny and warnings denied"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.lint-rustdoc]
description = "rustdoc with warnings denied, private items and intra-doc links included"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

[tasks.lint-shear]
description = "cargo-shear: fail on an unused or misplaced dependency"
run = "cargo shear"

[tasks.deny]
description = "cargo-deny: advisories, licenses, bans and sources"
run = "cargo deny check"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks.fmt-check]
description = "Fail if rustfmt would change a file"
run = "cargo fmt --check"

[tasks.check-docs]
shell = "bash -c"
description = "guard-markdown on every tracked Markdown file, then the OKF check on docs/ and on every other Markdown file"
run = """
command -v guard-markdown >/dev/null || { echo "guard-markdown not found; install it with: go install github.com/tbhb-dev/devtools/cmd/guard-markdown@v0.12.0" >&2; exit 1; }
git ls-files -z '*.md' ':!:.devtools/**' ':!:.claude/**' ':!:apm_modules/**' | while IFS= read -r -d '' f; do [ -e "$f" ] && printf '%s\\0' "$f"; done | xargs -0 guard-markdown
uv run --no-project --with pyyaml python scripts/okf-check.py docs
uv run --no-project --with pyyaml python scripts/okf-check.py --repo .
"""

[tasks.test-skills]
description = "Run the bats suites of the repository-local agent skills"
run = "bats .agents/skills/agent-commit/tests .agents/skills/agent-pr/tests .agents/skills/agent-merge-pr/tests"

[tasks.test-jargon]
description = "Unit tests for the new-term check"
run = "uv run --no-project --with-requirements scripts/tests/requirements.txt pytest scripts/tests -q"

[tasks.check]
description = "The full local gate: fmt, clippy, rustdoc, shear, deny, the tests, the skill suites, check-docs and the new-term tests"
depends = ["check-docs", "test-skills", "test-jargon"]
run = [
  "mise run fmt-check",
  "mise run lint-rust",
  "mise run lint-rustdoc",
  "mise run lint-shear",
  "mise run deny",
  "mise run test",
]

# The floors are the line and region coverage that the CI coverage job measured on its macOS
# runner, rounded down to a whole percent.
# The report runs as its own step because llvm-cov crashes when nextest and the report
# share one invocation.
[tasks.coverage]
description = "Run the tests under cargo-llvm-cov and fail below the line and region floors"
run = [
  "cargo llvm-cov nextest --workspace --locked --no-report",
  "cargo llvm-cov report --summary-only --fail-under-lines 23 --fail-under-regions 22",
]

[tasks.coverage-report]
description = "Write an HTML coverage report to target/llvm-cov/html"
run = [
  "cargo llvm-cov nextest --workspace --locked --no-report",
  "cargo llvm-cov report --html",
]

# No score gate: cargo-mutants has no threshold flag, and the floor is the maintainer's to set.
[tasks.mutants]
description = "Run cargo-mutants over the workspace with nextest; writes mutants.out and gates nothing"
run = "cargo mutants --workspace --test-tool nextest --jobs 2 --no-shuffle"

[tasks.install-fuzz-toolchain]
description = "Install the pinned nightly that cargo-fuzz needs"
run = "rustup toolchain install $AVIRT_FUZZ_TOOLCHAIN --profile minimal"

[tasks.fuzz]
description = "Run one fuzz target until stopped: mise run fuzz connect_authority -- -max_total_time=60"
depends = ["install-fuzz-toolchain"]
dir = "fuzz"
usage = '''
arg "<target>" help="a target under fuzz/fuzz_targets"
arg "[flags]" var=#true help="libFuzzer flags after --"
'''
run = 'RUSTUP_TOOLCHAIN=$AVIRT_FUZZ_TOOLCHAIN cargo fuzz run "${usage_target}" -- ${usage_flags}'

[tasks.fuzz-smoke]
description = "Run every fuzz target for 20 seconds each"
depends = ["install-fuzz-toolchain"]
dir = "fuzz"
run = '''
#!/usr/bin/env bash
set -euo pipefail
export RUSTUP_TOOLCHAIN=$AVIRT_FUZZ_TOOLCHAIN
for target in $(cargo fuzz list); do
  cargo fuzz run "$target" -- -max_total_time=20
done
'''

[tasks.check-all]
description = "Deeper bar: check and lint plus the full-history gitleaks scan"
run = ["mise run check", "mise run lint", "mise run devtools:gitleaks"]

[tasks.vuln]
description = "Fail when Cargo.lock holds a dependency with a published RustSec advisory"
run = "cargo deny check advisories"

[tasks.build-image]
description = "Build one workload image (claude or codex); the repository root is the build context"
usage = 'arg "<agent>" help="claude or codex"'
run = "container build -f workloads/${usage_agent}/Containerfile -t avirt-workload-${usage_agent}:dev ."

[tasks.build-images]
description = "Build both workload images"
depends = ["build-image claude", "build-image codex"]

[tasks.serve]
description = "Run avirthostd (picks CLAUDE_CODE_OAUTH_TOKEN up from mise.local.toml)"
depends = ["build-hostd"]
run = "./target/debug/avirthostd"

[tasks.build-hostd]
description = "Build avirthostd and the mediator it starts for each workload"
hide = true
run = "cargo build --quiet -p avirthostd -p avirtmediatord"

[tasks.launch]
description = "Start a workload on a running avirthostd: mise run launch claude \"prompt\" -- --follow"
usage = '''
arg "<agent>" help="claude or codex"
arg "<prompt>"
arg "[flags]" var=#true help="extra flags such as --cwd DIR --follow"
'''
run = 'cargo run --quiet -p avirt -- launch --agent "${usage_agent}" "${usage_prompt}" ${usage_flags}'

[tasks.lint-draft]
extends = "devtools:lint-draft"

[tasks.lint-pr-description]
extends = "devtools:lint-pr-description"
run = [
  "bash .claude/skills/pr/scripts/validate-description.sh",
  "vale --output=ai-tells-agent.tmpl PR_AGENTDESC.md",
  "cspell --config .cspell.jsonc --no-summary --no-progress --no-gitignore PR_AGENTDESC.md",
  "bash $DEVTOOLS_DIR/scripts/check-leaks.sh PR_AGENTDESC.md",
]

[tasks.lint-jargon]
description = "Report candidate terms in added prose for human review; always exits 0"
run = "uv run --script scripts/jargon_check.py"

[tasks.lint-prose]
extends = "devtools:lint-prose"

[tasks.lint-commit-msg]
extends = "devtools:lint-commit-msg"

[tasks.lint-squash-msg]
extends = "devtools:lint-squash-msg"

# devtools:lint-source-files excludes .claude, .agents and .codex wholesale,
# since devtools deploys its primitives there. The repository-local skills
# are authored in .agents/skills/agent-*, and the rules deployed into
# .claude/rules should still meet the prose bar, so this task selects them
# by name. Remove it once devtools offers a supported way to include paths.
[tasks.lint-skills]
shell = "bash -c"
description = "Lint the repository-local skills' sources and .claude/rules, which devtools' file selection skips"
run = """
set -euo pipefail
shopt -s nullglob
docs=(.agents/skills/agent-*/SKILL.md .claude/rules/*.md)
scripts=(.agents/skills/agent-*/scripts/*.sh)
vale --output=ai-tells-agent.tmpl "${docs[@]}"
guard-markdown "${docs[@]}"
shellcheck -o check-extra-masked-returns "${scripts[@]}"
shfmt -d "${scripts[@]}"
"""

[tasks.lint]
extends = "devtools:lint"
run = [
  "mise run devtools:check-vendored",
  "mise run devtools:check-pins",
  "mise run devtools:lint-apm",
  "mise run devtools:lint-leaks",
  "mise run devtools:check-leak-hook",
  "mise run lint-prose",
  "mise run devtools:lint-spelling",
  "mise run devtools:lint-markdown",
  "mise run devtools:lint-markdown-wrap",
  "mise run devtools:lint-config",
  "mise run devtools:lint-yaml",
  "mise run devtools:lint-toml",
  "mise run devtools:lint-mise",
  "mise run devtools:lint-workflows",
  "mise run devtools:lint-shell",
  "mise run devtools:lint-shell-fmt",
  "mise run lint-skills",
  "mise run devtools:lint-curl",
  "mise run lint-rust",
  "mise run lint-rustdoc",
  "mise run lint-shear",
]
