---
# Every action must be pinned to a full commit SHA, not a tag or branch.
# zizmor's default lets first-party actions use a ref pin; the wildcard here
# removes that exemption.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # First-party actions and workflows are pinned to their main branches,
  # which have no release tags; Renovate bumps the pins. Each move of a branch
  # leaves the `# main` comment naming a newer commit until Renovate's bump
  # merges. Renovate catches that drift instead of failing every pull request.
  stale-action-refs:
    ignore:
      - ci.yml
      - renovate.yaml
      - renovate-config-validator.yaml
  ref-version-mismatch:
    ignore:
      - ci.yml
      - renovate.yaml
      - renovate-config-validator.yaml
  # Off until actionlint accepts GitHub's `$/` self-repository syntax
  # (actionlint issue 711); then switch local action paths to that syntax.
  self-repository:
    disable: true
