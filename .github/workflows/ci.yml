---
# Main quality gate. avirt is a Rust workspace, so the gates are the full
# lint bar, the check aggregate (fmt, clippy, rustdoc, shear, deny and the
# tests, plus the docs checks) on Linux and macOS, the vendor-drift check,
# a RustSec advisory scan, cargo-deny, and the coverage floors. Every job
# installs the pinned toolchain through mise and runs its gate through
# `mise run`, so the mise config stays the single definition of what each
# gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A lockfile only binds a version it has already seen. Without this, moving
# a pin in mise.toml and leaving mise.lock alone makes mise fetch the new
# version, compute a fresh digest, and rewrite the lockfile in place -- so a
# Renovate PR that touched only the manifest would go green while the
# committed digests drifted from the pins under review. MISE_LOCKED makes
# that a hard failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Full history: the leak scan below reads every commit a pull
      # request adds, and a shallow clone is refused as incomplete.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9

      # mise installs the vale binary but does not fetch the style packages
      # .vale.ini declares.
      - name: Sync Vale styles
        run: mise run install-tools

      - name: Lint
        run: mise run lint

      # The tree scan in `lint` sees only the checkout. This reads every
      # commit, message, and author line the pull request adds, so a value
      # committed and removed again within the branch still fails. CI has no
      # private literals, so this runs the publishable patterns only.
      - name: Scan the pull request for leaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Scan source commits rather than GitHub's synthetic merge signature.
        run: mise run devtools:lint-leaks -- --range "${BASE_SHA}..${HEAD_SHA}"

  test-matrix:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os == 'macos-26' && fromJSON('["self-hosted","macos-m3-avirt"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The self-hosted runner's pre-job hook cleans the workspace and
          # keeps `experiments/poc/target/` warm, which the default `git clean -ffdx` would wipe.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Set up the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9

      # Registry downloads and the compiled dependencies. `experiments/poc/target/avirtvmd`
      # holds the Swift build, which this cache leaves out. It runs only on
      # GitHub-hosted runners, because the self-hosted runner keeps `experiments/poc/target/`
      # between jobs.
      - name: Cache the Rust build
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            experiments/poc/target
            !experiments/poc/target/avirtvmd
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/poc/Cargo.lock', 'mise.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      # The ci profile in experiments/poc/.config/nextest.toml: no retries, a flaky pass fails.
      - name: Check
        env:
          NEXTEST_PROFILE: ci
        run: mise run check

  # The matrix job reports as `test (ubuntu-24.04)` and `test (macos-26)`.
  # This job owns the plain name `test`, so the required-check list names
  # one check and stays stable when the matrix changes. `if: always()` keeps
  # it running after a failed slot, and anything but `success` -- failure,
  # cancelled, or skipped -- fails it.
  test:
    name: test
    if: always()
    needs: test-matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [[ "${RESULT}" != "success" ]]; then
            echo "the test matrix finished as ${RESULT}" >&2
            exit 1
          fi

  vuln:
    name: vuln
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: rust github:EmbarkStudios/cargo-deny

      - name: Check RustSec advisories
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run vuln

  # cargo-deny: advisories, licenses, bans and sources, under experiments/poc/deny.toml.
  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: rust github:EmbarkStudios/cargo-deny

      - name: Check dependencies
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run deny

  # The coverage floors in the mise coverage task. The baseline was measured on
  # macOS, so the gate runs there; cfg(target_os) code changes the totals.
  coverage:
    name: coverage
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9

      - name: Measure coverage
        env:
          NEXTEST_PROFILE: ci
        run: mise run coverage

  # Resyncs the devtools payload in place from vendir.yml and fails on any
  # difference from the committed tree. That catches a vendored file edited
  # in place, a sync nobody committed, and a manifest bump whose
  # vendir.lock.yml is stale.
  vendor-check:
    name: vendor-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: vendir

      - name: Check the vendored payload
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run devtools:check-vendored
