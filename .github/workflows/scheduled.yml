---
# Measurements that do not gate a pull request: the mutation baseline, the
# coverage history, and a short fuzz run of every target. Each job uploads its
# result as an artifact. A run is a trend, so a failure here means the tool
# broke or a fuzz target found a crash, not that a threshold moved.

name: scheduled

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutants:
    name: mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19

      # cargo-mutants exits 2 when mutants survive and 3 on timeouts. Neither
      # fails the job: the outcomes are the product, not a gate. A run that
      # wrote no outcomes file still fails.
      - name: Run cargo-mutants
        run: mise run mutants || test -f experiments/poc/mutants.out/outcomes.json

      - name: Upload the outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants
          path: experiments/poc/mutants.out/
          if-no-files-found: warn

  coverage-history:
    name: coverage-history
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19

      - name: Measure coverage
        env:
          NEXTEST_PROFILE: ci
        working-directory: experiments/poc
        run: |
          cargo llvm-cov nextest --workspace --locked --no-report
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          cargo llvm-cov report --html

      - name: Upload the reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            experiments/poc/coverage-summary.json
            experiments/poc/target/llvm-cov/html/

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19

      - name: Fuzz every target
        run: mise run fuzz-smoke

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: experiments/poc/fuzz/artifacts/
          if-no-files-found: warn
