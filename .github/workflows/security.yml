---
# Secret scanner. Gitleaks walks the full commit history and the working
# tree against its bundled rule set, so a credential committed anywhere in
# the repo's past fails the gate. The RustSec advisory scan is the `vuln`
# job in ci.yml.
#
# Triggers cover pull requests and pushes to `main` plus a daily cron that
# catches rules added to gitleaks after the pull request that added a
# secret.
#
# The gate is the shared `devtools:gitleaks` task, which pins the binary
# through the vendored payload and asserts the walk reached a commit --
# gitleaks otherwise exits 0 on a git failure and an empty scan reads as a
# clean one.

name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "26 6 * * *"

permissions:
  contents: read

# See ci.yml: without this a pin can move without its lockfile entry.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit's diff, not just
          # the checkout tip.
          fetch-depth: 0
          # The task scans the history reachable from HEAD. On a pull
          # request GitHub checks out a synthetic merge commit by default,
          # which has a signature and an author line no contributor
          # wrote. Checking out the pull request head ends the scan range
          # at the commits the author pushed. A push or a dispatch has no
          # pull request, so it falls back to the commit that triggered
          # the run.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: gitleaks

      - name: Scan for committed secrets
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run devtools:gitleaks
